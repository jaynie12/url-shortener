# docker-compose.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - 5435:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: on-failure:3
  redis:
    image: redis:latest
    command: redis-server
    volumes:
      - redis:/var/lib/redis
    ports:
      - 6379:6379
volumes:
  pg-data:
  redis:
